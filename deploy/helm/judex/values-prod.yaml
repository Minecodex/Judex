# Configuration baseline only: not an HA or business-production-readiness claim.
environment: production
image:
  tag: 0.1.0
resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: "2", memory: 1Gi}
postgresql:
  embedded: {enabled: true, storage: 50Gi}
objectStorage:
  embedded: {enabled: true, storage: 100Gi}

# P7-01：生产必填 allowedOrigins（浏览器写操作 Origin 白名单）。
server:
  mode: all
  allowedOrigins:
    - https://judex.example.internal
  previewOrigin: ""   # 独立预览 origin（配置后才提供交互式 HTML 预览）
  modelCatalogSecret: ""
