{{- if .Values.objectStorage.embedded.enabled }}
# Compact single-instance baseline. This is not a production HA topology.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-seaweedfs
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: judex-seaweedfs, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
    - {name: master, port: 9333, targetPort: 9333}
    - {name: filer, port: 8888, targetPort: 8888}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-seaweedfs
spec:
  serviceName: {{ .Release.Name }}-seaweedfs
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: judex-seaweedfs, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: judex-seaweedfs, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: seaweedfs
          image: {{ .Values.objectStorage.embedded.image }}
          command: [/usr/bin/weed]
          args:
            - server
            - -dir=/data
            - -master
            - -volume
            - -ip=$(POD_IP)
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB={{ .Values.objectStorage.embedded.volumeSizeLimitMB }}
            - -volume.max={{ .Values.objectStorage.embedded.maxVolumes }}
            - -filer
            - -filer.port=8888
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/seaweedfs_s3_config
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: WEED_MASTER_VOLUME_GROWTH_COPY_1, value: {{ .Values.objectStorage.embedded.growthCount | quote }}}
            - {name: WEED_LEVELDB2_ENABLED, value: "true"}
            - {name: WEED_LEVELDB2_DIR, value: /data/filer}
          ports: [{containerPort: 8333}, {containerPort: 9333}, {containerPort: 8888}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/seaweedfs, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe: {httpGet: {path: /cluster/status, port: 9333}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: 8333}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /cluster/status, port: 9333}, periodSeconds: 15}
      volumes:
        - name: config
          secret:
            secretName: judex-storage-auth
            items: [{key: seaweedfs_s3_config, path: seaweedfs_s3_config}]
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations: {helm.sh/resource-policy: keep}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.objectStorage.embedded.storageClass }}
        storageClassName: {{ .Values.objectStorage.embedded.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.objectStorage.embedded.storage }}}
{{- end }}
