{{- if and .Values.sandbox.enabled .Values.server.materialProjection.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "judex.name" . }}-materials
  labels: {{ include "judex.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "judex.name" . }}-materials
  namespace: {{ .Release.Namespace }}-sandboxes
  labels: {{ include "judex.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "judex.name" . }}-materials
  namespace: {{ .Release.Namespace }}-sandboxes
  labels: {{ include "judex.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "judex.name" . }}-materials
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "judex.name" . }}-materials
{{- end }}
