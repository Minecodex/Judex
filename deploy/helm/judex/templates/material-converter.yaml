{{- if .Values.server.materialPreview.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-material-converter
  labels: {app.kubernetes.io/name: judex-material-converter, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: judex-material-converter, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: judex-material-converter, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: converter
          image: {{ .Values.server.materialPreview.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 9081}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: temporary, mountPath: /tmp}, {name: home, mountPath: /home/judex}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
      volumes: [{name: temporary, emptyDir: {sizeLimit: 512Mi}}, {name: home, emptyDir: {sizeLimit: 32Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-material-converter
spec:
  selector: {app.kubernetes.io/name: judex-material-converter, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 9081, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-material-converter
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: judex-material-converter, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: judex, app.kubernetes.io/instance: {{ .Release.Name }}}
      ports: [{port: 9081, protocol: TCP}]
  egress: []
{{- end }}
