  - {name: repositories, description: 仓库元数据}
  - {name: topics, description: 议题与消息}
  - {name: submissions, description: 统一提交}
  - {name: materials, description: 上传与材料版本}
  - {name: events, description: SSE 事件}
  - {name: plans, description: 计划}
  - {name: tasks, description: 任务}
