openapi: 3.1.0
info:
  title: Judex API
  version: 2.0.0
  summary: Judex V2 群聊协作 API（协议能力版本 2）
  description: |
    所有业务路径前缀 /api/v1（本规范路径不含该前缀，由网关/服务器统一挂载）。

    协议规则：JSON 字段 camelCase；UUID 字符串；时间 RFC3339 UTC；版本为正整数。
    成功 envelope `{data, meta:{requestId,serverTime,eventCursor?}}`；命令额外返回 `affected`。
    错误 envelope `{error:{code,message,details?,retryable},requestId}`；客户端按 code+details 处理，不解析 message。
    列表使用 `{items}`；消息按 before/after 序号分页，知识按 after 序号分页。
    有副作用的业务命令要求 Idempotency-Key 头（UUID）；配置和讨论控制使用 expectedVersion。
    Web 会话使用 Cookie+CSRF（sessionCookie）；CLI 使用受限 Bearer grant（bearerGrant）。
    GET /system 和 /capabilities 声明协议 2；旧计划、任务和审批接口已移除。
servers:
  - url: /api/v1
    description: Same-origin (SPA or CLI with explicit base URL)
tags:
  - {name: auth, description: 账号与设备授权}
  - {name: projects, description: 项目与职位参考配置}
  - {name: collaboration, description: 群聊与平台私聊}
  - {name: files, description: 固定版本文件与授权预览}
  - {name: agents, description: 对等岗位运行与公共上下文}
