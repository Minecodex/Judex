paths:
  /projects/{projectId}/submissions/{submissionId}/analysis:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/ProjectIdParam
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getSubmissionAnalysis
      summary: 读取提交对应的任务或项目范围分析
      tags: [collaboration]
      security:
        - sessionCookie: []
        - bearerGrant: []
      responses:
        '200':
          description: 原提交的公开分析状态、依据及草稿引用。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: ../components/collaboration.yaml#/components/schemas/TaskAnalysis
                  meta:
                    $ref: ../components/common.yaml#/components/schemas/RequestMeta
        '400':
          $ref: ../components/common.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/common.yaml#/components/responses/NotFound
