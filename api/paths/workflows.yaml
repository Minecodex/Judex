# 流程（docs/plans/v1/02 §7、06 §3）
paths:
  /projects/{projectId}/workflows:
    parameters:
      - $ref: '../components/common.yaml#/components/parameters/ProjectIdParam'
    get:
      operationId: listWorkflows
      summary: 流程定义列表
      tags: [workflows]
      security:
        - sessionCookie: []
        - bearerGrant: []
      responses:
        '200':
          description: 流程分页。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [items, nextCursor]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '../components/projects.yaml#/components/schemas/Workflow'
                      nextCursor:
                        type:
                          - string
                          - 'null'
                  meta:
                    $ref: '../components/common.yaml#/components/schemas/RequestMeta'
    post:
      operationId: createWorkflow
      summary: 新建流程草稿（manager；AI 也可另建草稿）
      tags: [workflows]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/projects.yaml#/components/schemas/WorkflowDraftBody'
      responses:
        '201':
          description: 已创建。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '../components/projects.yaml#/components/schemas/Workflow'
                  meta:
                    $ref: '../components/common.yaml#/components/schemas/CommandMeta'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
  /projects/{projectId}/workflows/{workflowId}/versions:
    parameters:
      - $ref: '../components/common.yaml#/components/parameters/ProjectIdParam'
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listWorkflowVersions
      summary: 已发布版本与公开差异
      tags: [workflows]
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/LimitParam'
        - $ref: '../components/common.yaml#/components/parameters/CursorParam'
      responses:
        '200':
          description: 版本分页。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [items, nextCursor]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '../components/projects.yaml#/components/schemas/WorkflowVersion'
                      nextCursor:
                        type:
                          - string
                          - 'null'
                  meta:
                    $ref: '../components/common.yaml#/components/schemas/RequestMeta'
  /projects/{projectId}/workflows/{workflowId}/draft:
    parameters:
      - $ref: '../components/common.yaml#/components/parameters/ProjectIdParam'
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateWorkflowDraft
      summary: 更新流程草稿（只影响 draft；manager）
      tags: [workflows]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, body]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                body:
                  $ref: '../components/projects.yaml#/components/schemas/WorkflowDraftBody'
      responses:
        '200':
          description: 草稿版本。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '../components/projects.yaml#/components/schemas/WorkflowVersion'
                  meta:
                    $ref: '../components/common.yaml#/components/schemas/CommandMeta'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
  /projects/{projectId}/workflows/{workflowId}/publish:
    parameters:
      - $ref: '../components/common.yaml#/components/parameters/ProjectIdParam'
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: publishWorkflow
      summary: 发布流程版本（manager 人工确认；版本不可变）
      tags: [workflows]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/projects.yaml#/components/schemas/PublishWorkflowRequest'
      responses:
        '200':
          description: 已发布的版本。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '../components/projects.yaml#/components/schemas/WorkflowVersion'
                  meta:
                    $ref: '../components/common.yaml#/components/schemas/CommandMeta'
        '403':
          $ref: '../components/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/common.yaml#/components/responses/Conflict'
