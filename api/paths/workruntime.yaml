paths:
  /projects/{projectId}/plans/{planId}/draft:
    parameters:
      - $ref: ../components/common.yaml#/components/parameters/ProjectIdParam
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updatePlanDraft
      summary: updatePlanDraft
      tags:
        - work
      security:
        - sessionCookie: []
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKeyParam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/workruntime.yaml#/components/schemas/WorkDraftUpdate
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ../components/work.yaml#/components/schemas/Plan
                  meta:
                    $ref: ../components/common.yaml#/components/schemas/CommandMeta
        '409':
          $ref: ../components/common.yaml#/components/responses/Conflict
