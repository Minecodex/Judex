paths:
  /confirmation-intents:
    parameters: []
    post:
      operationId: createGlobalConfirmationIntent
      summary: 用户级建项目确认意图（仅 project.create）
      tags:
        - intents
      security:
        - bearerGrant: []
        - sessionCookie: []
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKeyParam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/agent.yaml#/components/schemas/ConfirmationIntentRequest
      responses:
        '201':
          description: 意图已创建。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ../components/agent.yaml#/components/schemas/ConfirmationIntent
                  meta:
                    $ref: ../components/common.yaml#/components/schemas/CommandMeta
        '403':
          $ref: ../components/common.yaml#/components/responses/Forbidden
  /confirmation-intents/{intentId}:
    parameters:
      - name: intentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getGlobalConfirmationIntent
      summary: 用户级建项目确认意图（仅 project.create）
      tags:
        - intents
      security:
        - bearerGrant: []
        - sessionCookie: []
      responses:
        '200':
          description: 意图状态与 resultRef。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ../components/agent.yaml#/components/schemas/ConfirmationIntent
                  meta:
                    $ref: ../components/common.yaml#/components/schemas/RequestMeta
        '404':
          $ref: ../components/common.yaml#/components/responses/NotFound
  /confirmation-intents/{intentId}/confirm:
    parameters:
      - name: intentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: confirmGlobalIntent
      summary: 用户级建项目确认意图（仅 project.create）
      tags:
        - intents
      security:
        - sessionCookie: []
      parameters:
        - $ref: ../components/common.yaml#/components/parameters/IdempotencyKeyParam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/agent.yaml#/components/schemas/ConfirmIntentRequest
      responses:
        '200':
          description: 确认结果（committed/rejected）与 resultRef。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ../components/agent.yaml#/components/schemas/ConfirmationIntent
                  meta:
                    $ref: ../components/common.yaml#/components/schemas/CommandMeta
        '403':
          $ref: ../components/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../components/common.yaml#/components/responses/Conflict
