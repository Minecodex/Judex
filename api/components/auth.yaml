# 认证与账户对象（docs/plans/v1/02 §1-§3、06 §2）
components:
  schemas:
    PublicUser:
      type: object
      required: [id, displayName, email, locale, status, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 80
        email:
          type: string
          description: 登录邮箱（未验证的登录标识，非已验证企业身份）。
        locale:
          type: string
          enum: [zh-CN, en]
        status:
          type: string
          enum: [active, disabled]
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: 允许粘贴与密码管理器，不限制字符类别。
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 128
    AuthResult:
      type: object
      required: [user, sessionExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        sessionExpiresAt:
          type: string
          format: date-time
    SessionInfo:
      type: object
      required: [user, expiresAt, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
          description: 与会话绑定的 CSRF token；写请求必须以 X-CSRF-Token 头回传。
    UpdateMeRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        locale:
          type: string
          enum: [zh-CN, en]
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    RecoverRequest:
      type: object
      required: [recoveryCode, newPassword]
      properties:
        recoveryCode:
          type: string
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    SessionSummary:
      type: object
      required: [id, createdAt, expiresAt, lastSeenAt, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
    DeviceAuthorizationRequest:
      type: object
      required: [deviceName, requestedScopes]
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
        requestedScopes:
          type: array
          items:
            type: string
        projectScope:
          type: array
          items:
            type: string
            format: uuid
          description: 空/缺省表示仅本人项目列表，后续按需授权。
    DeviceAuthorization:
      type: object
      required: [deviceCode, userCode, verificationUri, expiresIn, interval]
      properties:
        deviceCode:
          type: string
        userCode:
          type: string
        verificationUri:
          type: string
          format: uri-reference
        expiresIn:
          type: integer
          description: 秒。
        interval:
          type: integer
          description: 轮询间隔秒数。
    DeviceTokenRequest:
      type: object
      required: [deviceCode]
      properties:
        deviceCode:
          type: string
    DeviceTokenPending:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, slow_down]
        interval:
          type: integer
    TokenPair:
      type: object
      required: [accessToken, accessExpiresAt, refreshToken, refreshExpiresAt, scopes]
      properties:
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    DeviceConfirmRequest:
      type: object
      required: [userCode, approved]
      properties:
        userCode:
          type: string
        approved:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        projectScope:
          type: array
          items:
            type: string
            format: uuid
    DeviceConfirmResult:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [approved, denied]
    ClientGrant:
      type: object
      required: [id, deviceName, scopes, createdAt, expiresAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        scopes:
          type: array
          items:
            type: string
        projectScope:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
    SystemInfo:
      type: object
      required: [name, version, protocolVersion, schemaRange]
      properties:
        name:
          type: string
        version:
          type: string
        commit:
          type: string
        protocolVersion:
          type: string
        schemaRange:
          type: string
        capabilities:
          type: object
          additionalProperties: true
    Capabilities:
      type: object
      required: [registerEnabled, uploadLimits, discussionRounds, confirmation]
      properties:
        registerEnabled:
          type: boolean
        uploadLimits:
          $ref: '#/components/schemas/UploadLimits'
        discussionRounds:
          type: object
          required: [default, min, max]
          properties:
            default:
              type: integer
            min:
              type: integer
            max:
              type: integer
        approvalTimeoutSeconds:
          type: object
          required: [default, min, max]
          properties:
            default:
              type: integer
            min:
              type: integer
            max:
              type: integer
        confirmation:
          type: object
          required: [browserConfirmRequired]
          properties:
            browserConfirmRequired:
              type: boolean
            intentTtlSeconds:
              type: integer
        modelsConfigured:
          type: boolean
        sandboxConfigured:
          type: boolean
    UploadLimits:
      type: object
      required: [maxFileBytes, maxBundleBytes, maxFilesPerSubmission, maxTextBytes, partSizeBytes]
      properties:
        maxFileBytes:
          type: integer
        maxBundleBytes:
          type: integer
        maxFilesPerSubmission:
          type: integer
        maxTextBytes:
          type: integer
        partSizeBytes:
          type: integer
