# 讨论、材料与事件对象（docs/plans/v1/04、06 §4）
components:
  schemas:
    Topic:
      type: object
      required: [id, title, kind, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        kind:
          type: string
          enum: [project_room, discussion, handoff]
        contextType:
          type:
            - string
            - 'null'
        contextId:
          type:
            - string
            - 'null'
          format: uuid
        lastMessageSeq:
          type: integer
        links:
          type: array
          items:
            type: object
            required: [objectType, objectId]
            properties:
              objectType:
                type: string
                enum: [plan, task]
              objectId:
                type: string
                format: uuid
        createdAt:
          type: string
          format: date-time
    CreateTopicRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        initialMessage:
          type: string
          maxLength: 65536
        links:
          type: array
          items:
            type: object
            required: [objectType, objectId]
            properties:
              objectType:
                type: string
                enum: [plan, task]
              objectId:
                type: string
                format: uuid
    TopicLinkRequest:
      type: object
      required: [targetRefs, expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        targetRefs:
          type: array
          minItems: 1
          items:
            type: object
            required: [objectType, objectId]
            properties:
              objectType:
                type: string
                enum: [plan, task]
              objectId:
                type: string
                format: uuid
    Message:
      type: object
      required: [id, topicId, seq, kind, content, state, createdAt]
      properties:
        id:
          type: string
          format: uuid
        topicId:
          type: string
          format: uuid
        seq:
          type: integer
        kind:
          type: string
          enum: [human, agent, system]
        authorUserId:
          type:
            - string
            - 'null'
          format: uuid
        authorDisplayName:
          type:
            - string
            - 'null'
        identityId:
          type:
            - string
            - 'null'
          format: uuid
        identityName:
          type:
            - string
            - 'null'
        source:
          type:
            - string
            - 'null'
          enum: [web, cli, platform]
        submissionId:
          type:
            - string
            - 'null'
          format: uuid
        runId:
          type:
            - string
            - 'null'
          format: uuid
        content:
          type: string
        state:
          type: string
          enum: [committed, superseded]
        materialVersionIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
    Submission:
      type: object
      required: [id, clientSubmissionId, purpose, source, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        clientSubmissionId:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [message, progress, delivery, material]
        source:
          type: string
          enum: [web, cli, agent]
        text:
          type: string
        topicId:
          type:
            - string
            - 'null'
          format: uuid
        taskId:
          type:
            - string
            - 'null'
          format: uuid
        identityId:
          type:
            - string
            - 'null'
          format: uuid
        actorUserId:
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
          enum: [preparing, ready, failed]
        materialVersionIds:
          type: array
          items:
            type: string
            format: uuid
        codeRefs:
          type: array
          items:
            $ref: '#/components/schemas/CodeRef'
        messageId:
          type:
            - string
            - 'null'
          format: uuid
        reportId:
          type:
            - string
            - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
    CodeRef:
      type: object
      required: [repositoryId, verification]
      properties:
        repositoryId:
          type: string
          format: uuid
        branch:
          type: string
        commit:
          type: string
          description: 完整 commit SHA；服务端固定 verification=reported。
        pullUrl:
          type: string
        note:
          type: string
        verification:
          type: string
          enum: [reported]
    SubmissionRequest:
      type: object
      required: [clientSubmissionId, purpose, text]
      properties:
        clientSubmissionId:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [message, progress, delivery, material]
        text:
          type: string
          minLength: 1
          maxLength: 65536
        topicId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        identityId:
          type: string
          format: uuid
        expectedTaskVersion:
          type: integer
          minimum: 1
        materialVersionIds:
          type: array
          items:
            type: string
            format: uuid
        codeRefs:
          type: array
          items:
            $ref: '#/components/schemas/CodeRef'
    UploadSession:
      type: object
      required: [id, state, kind, expectedSize, checksum, partSize, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [open, completed, cancelled, expired]
        kind:
          type: string
          enum: [file, html_bundle]
        name:
          type: string
        expectedSize:
          type: integer
        checksum:
          type: string
          description: 完整文件 SHA256 十六进制。
        mime:
          type: string
        partSize:
          type: integer
          description: 分片大小字节数（推荐 8MiB）。
        partCount:
          type: integer
        materialId:
          type:
            - string
            - 'null'
          format: uuid
        resultVersionId:
          type:
            - string
            - 'null'
          format: uuid
        expiresAt:
          type: string
          format: date-time
    CreateUploadRequest:
      type: object
      required: [name, size, sha256, mime, kind]
      properties:
        name:
          type: string
          maxLength: 500
        size:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        mime:
          type: string
        kind:
          type: string
          enum: [file, html_bundle]
        entrypoint:
          type: string
          description: HTML 包入口相对路径。
    CompleteUploadRequest:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            type: object
            required: [partNumber, sha256]
            properties:
              partNumber:
                type: integer
                minimum: 1
              sha256:
                type: string
        sourceVersion:
          type: integer
          description: 针对已有材料派生发布时的当前版本号；落后返回 SOURCE_VERSION_CONFLICT。
    Material:
      type: object
      required: [id, title, kind, visibility, currentVersionId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        kind:
          type: string
          enum: [file, html_bundle, text]
        visibility:
          type: string
          enum: [project]
        currentVersionId:
          type:
            - string
            - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
    MaterialVersion:
      type: object
      required: [id, revision, state, sha256, size, createdAt]
      properties:
        id:
          type: string
          format: uuid
        materialId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [staged, ready, unavailable]
        sha256:
          type: string
        size:
          type: integer
        mime:
          type: string
        entrypoint:
          type:
            - string
            - 'null'
        entries:
          type: array
          description: HTML 包的相对路径清单。
          items:
            type: object
            required: [relativePath, size, sha256]
            properties:
              relativePath:
                type: string
              size:
                type: integer
              sha256:
                type: string
        authorId:
          type:
            - string
            - 'null'
        runId:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    PreviewSession:
      type: object
      required: [previewUrl, expiresAt]
      properties:
        previewUrl:
          type: string
          format: uri
          description: 隔离 preview origin 的短时 URL。
        expiresAt:
          type: string
          format: date-time
    ProjectEvent:
      type: object
      required: [eventId, projectId, seq, type, objectType, objectId, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - message.committed
            - proposal.changed
            - task.changed
            - plan.changed
            - handoff.changed
            - material.ready
            - material.unavailable
            - workflow.published
            - membership.changed
            - run.changed
            - notification.created
        objectType:
          type: string
        objectId:
          type: string
        version:
          type: integer
        occurredAt:
          type: string
          format: date-time
        changedFields:
          type: array
          items:
            type: string
        refs:
          type: object
          additionalProperties: true
    Notification:
      type: object
      required: [id, type, createdAt, readAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        objectRef:
          type: object
          additionalProperties: true
        eventId:
          type: string
          format: uuid
        readAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    MarkNotificationsRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
        cursor:
          type: string
    PendingAction:
      type: object
      required: [id, kind, objectType, objectId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [submit, approve, receive, accept, revise, reopen]
        projectId:
          type: string
          format: uuid
        objectType:
          type: string
          enum: [proposal, handoff, task, plan, topic]
        objectId:
          type: string
          format: uuid
        reviewId:
          type:
            - string
            - 'null'
          format: uuid
        dueAt:
          type:
            - string
            - 'null'
          format: date-time
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
