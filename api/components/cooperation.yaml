components:
  schemas:
    TaskMainTopicResult:
      type: object
      required: [mainTopicId, topic]
      properties:
        mainTopicId:
          type: string
          format: uuid
        topic:
          $ref: '#/components/schemas/Topic'
    ReplaceTopicLinksRequest:
      type: object
      required: [expectedLinksVersion, targetRefs]
      properties:
        expectedLinksVersion:
          type: integer
          format: int64
          minimum: 1
        targetRefs:
          type: array
          maxItems: 100
          items:
            type: object
            required: [objectType, objectId]
            properties:
              objectType:
                type: string
                enum: [plan, task]
              objectId:
                type: string
                format: uuid
    DeliveryCard:
      type: object
      required: [id, objectId, objectType, taskId, planId, title, status, version, summary, incoming, outgoing, sourceCount, pendingCount, createdAt]
      properties:
        id: {type: string, format: uuid}
        objectId: {type: string, format: uuid}
        objectType: {type: string, enum: [task, handoff]}
        taskId: {type: string, format: uuid}
        planId: {type: [string, 'null'], format: uuid}
        title: {type: string}
        status: {type: string}
        version: {type: integer, format: int64}
        summary: {type: string}
        incoming: {type: boolean}
        outgoing: {type: boolean}
        sourceCount: {type: integer}
        pendingCount: {type: integer}
        createdAt: {type: string, format: date-time}
  responses:
    TaskMainTopicResponse:
      description: 稳定的任务主讨论，已有会话复用。
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: '#/components/schemas/TaskMainTopicResult'
              meta:
                $ref: '#/components/schemas/CommandMeta'
