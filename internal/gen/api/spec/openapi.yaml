          type: integer
          format: int64
        kind:
          type: string
        data:
          type: object
          additionalProperties: true
      required:
        - seq
        - kind
        - data
    V2WorkflowGraph:
      type: object
      additionalProperties: false
      properties:
        nodes:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                maxLength: 80
                pattern: ^[a-zA-Z0-9_-]{1,80}$
              name:
                type: string
                maxLength: 240
                minLength: 1
              kind:
                type: string
                enum:
                  - start
                  - activity
                  - decision
                  - end
              phase:
                type: string
                maxLength: 240
              responsibility:
                type: string
                maxLength: 4000
            required:
              - id
              - name
              - kind
              - phase
              - responsibility
        edges:
          type: array
          maxItems: 300
          items:
            type: object
            additionalProperties: false
            properties:
              from:
                type: string
                maxLength: 80
              to:
                type: string
                maxLength: 80
              kind:
                type: string
                enum:
                  - sequence
                  - feedback
              label:
                type: string
                maxLength: 240
            required:
              - from
              - to
              - kind
              - label
      required:
        - nodes
        - edges
    V2WorkflowDraft:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
        content:
          type: string
          maxLength: 32000
        graph:
          $ref: '#/components/schemas/V2WorkflowGraph'
      required:
        - name
        - content
        - graph
    V2WorkflowDraftInput:
      type: object
      additionalProperties: false
      properties:
        instruction:
          type: string
          maxLength: 8000
          minLength: 1
        locale:
          type: string
          enum:
            - zh-CN
            - en
        current:
          $ref: '#/components/schemas/V2WorkflowDraft'
      required:
        - instruction
        - locale
    V2WorkflowDraftResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - queued
            - running
            - ready
            - failed
        result:
          $ref: '#/components/schemas/V2WorkflowDraft'
          nullable: true
        error:
          type: string
          nullable: true
      required:
        - id
        - state
        - result
        - error
  parameters:
    LimitParam:
      name: limit
      in: query
      description: 分页大小，范围 1-100，默认 50。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CursorParam:
      name: cursor
      in: query
      description: 不透明分页游标，编码范围与过滤条件。
      schema:
        type: string
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端生成的 UUID；同键同载荷重试返回原结果，同键异载荷返回 409。
      schema:
        type: string
        format: uuid
    ProjectIdParam:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求不合法（400/422，VALIDATION_ERROR 等）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证（401，UNAUTHENTICATED/SESSION_EXPIRED/GRANT_REVOKED）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 已认证但无权限（403，FORBIDDEN/HUMAN_CONFIRMATION_REQUIRED）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或对非成员隐藏存在性（404）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 状态/版本/幂等冲突（409，详见 error.code）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequirementUnmet:
      description: 前置条件未满足（412，details.blockers 列明阻塞对象）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooLarge:
      description: 请求体过大或类型不支持（413/415）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 速率或预算限制（429，带 Retry-After）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: 依赖暂不可用（503，retryable 明示）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Internal:
      description: 内部错误（500）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-judex_session
      description: Web 会话 Cookie（本地 HTTP 开发使用 judex_dev_session）。
    bearerGrant:
      type: http
      scheme: bearer
      description: CLI access token（受限 grant，无人工审批能力）。
