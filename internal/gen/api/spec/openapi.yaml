openapi: 3.1.0
info:
  title: Judex API
  version: 2.0.0
  summary: Judex V2 群聊协作 API（协议能力版本 2）
  description: |
    所有业务路径前缀 /api/v1（本规范路径不含该前缀，由网关/服务器统一挂载）。

    协议规则：JSON 字段 camelCase；UUID 字符串；时间 RFC3339 UTC；版本为正整数。
    成功 envelope `{data, meta:{requestId,serverTime,eventCursor?}}`；命令额外返回 `affected`。
    错误 envelope `{error:{code,message,details?,retryable},requestId}`；客户端按 code+details 处理，不解析 message。
    列表使用 `{items}`；消息按 before/after 序号分页，知识按 after 序号分页。
    有副作用的业务命令要求 Idempotency-Key 头（UUID）；配置和讨论控制使用 expectedVersion。
    Web 会话使用 Cookie+CSRF（sessionCookie）；CLI 使用受限 Bearer grant（bearerGrant）。
    GET /system 和 /capabilities 声明协议 2；旧计划、任务和审批接口已移除。
servers:
  - url: /api/v1
    description: Same-origin (SPA or CLI with explicit base URL)
tags:
  - {name: auth, description: 账号与设备授权}
  - {name: projects, description: 项目与职位参考配置}
  - {name: collaboration, description: 群聊与平台私聊}
  - {name: files, description: 固定版本文件与授权预览}
  - {name: agents, description: 对等岗位运行与公共上下文}

paths:
  /auth/register:
    post:
      operationId: register
      summary: 自由注册（邮箱+密码，无邮件验证）
      tags:
        - auth
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功并建立会话（Set-Cookie）。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 邮箱已占用（EMAIL_IN_USE）或幂等冲突。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      operationId: login
      summary: 登录（错误统一 INVALID_CREDENTIALS）
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功（Set-Cookie）。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/session:
    get:
      operationId: getSession
      summary: 当前会话信息（含 CSRF token）
      tags:
        - auth
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 会话有效。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/SessionInfo'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      operationId: logout
      summary: 撤销当前会话并清 Cookie
      tags:
        - auth
      security:
        - sessionCookie: []
        - bearerGrant: []
      responses:
        '200':
          description: 已撤销；会话已过期也允许清本地 Cookie。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - revoked
                    properties:
                      revoked:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: 撤销其他会话与授权
      tags:
        - auth
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedAuthVersion
              properties:
                expectedAuthVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 撤销数量。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - revokedSessions
                      - revokedGrants
                    properties:
                      revokedSessions:
                        type: integer
                      revokedGrants:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/recover:
    post:
      operationId: recoverPassword
      summary: 使用一次性恢复码设置新密码（不自动登录）
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverRequest'
      responses:
        '200':
          description: 完成；旧会话与授权已撤销。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - completed
                    properties:
                      completed:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/device/authorizations:
    post:
      operationId: createDeviceAuthorization
      summary: CLI 发起设备授权（返回 deviceCode/userCode）
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
      responses:
        '201':
          description: 已创建。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceAuthorization'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/device/token:
    post:
      operationId: pollDeviceToken
      summary: CLI 轮询设备授权结果（pending/slow_down/denied/expired/token）
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: pending/slow_down 状态。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceTokenPending'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '201':
          description: 授权完成，返回 token 对。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          description: denied 或 expired。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/device/confirm:
    post:
      operationId: confirmDeviceAuthorization
      summary: 浏览器确认/拒绝设备授权（本人+CSRF）
      tags:
        - auth
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceConfirmRequest'
      responses:
        '200':
          description: 确认结果。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceConfirmResult'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/token/refresh:
    post:
      operationId: refreshToken
      summary: 轮换 token 对（旧 refresh 重放撤销整族）
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 新 token 对。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/device/review:
    get:
      operationId: getDeviceAuthorization
      tags:
        - auth
      summary: Review a pending device authorization
      security:
        - sessionCookie: []
      parameters:
        - name: userCode
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device name, requested scopes and expiry for human review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    patch:
      operationId: updateMe
      summary: 更新本人资料（不改邮箱）
      tags:
        - me
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 更新后的用户。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/PublicUser'
                  meta:
                    $ref: '#/components/schemas/CommandMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/password:
    post:
      operationId: changePassword
      summary: 修改密码（轮换当前会话，撤销其他会话/授权）
      tags:
        - me
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功，返回轮换后的会话。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/CommandMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/sessions:
    get:
      operationId: listSessions
      summary: 本人活跃会话列表（无 secret）
      tags:
        - me
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: 会话分页。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - items
                      - nextCursor
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/SessionSummary'
                      nextCursor:
                        type:
                          - string
                          - 'null'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: 撤销指定会话
      tags:
        - me
      security:
        - sessionCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 已撤销。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - revoked
                    properties:
                      revoked:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/CommandMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/client-grants:
    get:
      operationId: listClientGrants
      summary: 本人 CLI 设备授权列表
      tags:
        - me
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: 授权分页。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - items
                      - nextCursor
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClientGrant'
                      nextCursor:
                        type:
                          - string
                          - 'null'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/client-grants/{grantId}:
    delete:
      operationId: revokeClientGrant
      summary: 撤销 CLI 设备授权
      tags:
        - me
      security:
        - sessionCookie: []
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 已撤销。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - revoked
                    properties:
                      revoked:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/CommandMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /template-presets:
    get:
      operationId: listTemplatePresets
      summary: listTemplatePresets
      tags:
        - v2
      security:
        - sessionCookie: []
        - bearerGrant: []
      responses:
        '200':
          description: Versioned V2 advisory templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/V2PresetCatalog'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
                required:
                  - data
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/template-presets:
    post:
      operationId: importTemplatePresets
      summary: importTemplatePresets
      tags:
        - v2
      security:
        - sessionCookie: []
        - bearerGrant: []
      responses:
        '200':
          description: Versioned V2 advisory templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/V2PresetResult'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
                required:
                  - data
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2PresetImport'
  /system:
    get:
      operationId: getSystem
      summary: getSystem
      tags:
        - v2
      security: []
      parameters: []
      responses:
        '200':
          description: V2 resource. Lists use data.items; immutable references retain their exact version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /capabilities:
    get:
      operationId: getCapabilities
      summary: getCapabilities
      tags:
        - v2
      security: []
      parameters: []
      responses:
        '200':
          description: V2 resource. Lists use data.items; immutable references retain their exact version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /models:
    get:
      operationId: listModels
      summary: listModels
      tags:
        - v2
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters: []
      responses:
        '200':
          description: V2 resource. Lists use data.items; immutable references retain their exact version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users:
    get:
      operationId: searchUsers
      summary: searchUsers
      tags:
        - v2
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: V2 resource. Lists use data.items; immutable references retain their exact version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects:
    get:
      operationId: listProjects
      summary: listProjects
      tags:
        - v2
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters: []
      responses:
        '200':
          description: Authorized V2 resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/V2Project'
                    required:
                      - items
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
                required:
                  - data
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createProject
      summary: createProject
      tags:
        - v2
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '200':
          description: Authorized V2 resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/V2Project'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
                required:
                  - data
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2ProjectInput'
  /projects/{projectId}:
    get:
      operationId: getProject
      summary: getProject
      tags:
        - v2
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized V2 resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/V2Project'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
                required:
                  - data
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
