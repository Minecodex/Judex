openapi: 3.1.0
info:
  title: Judex API
  version: 1.0.0
  summary: Judex 协作平台公共 API（docs/plans/v1/06 契约源）
  description: |
    所有业务路径前缀 /api/v1（本规范路径不含该前缀，由网关/服务器统一挂载）。

    协议规则：JSON 字段 camelCase；UUID 字符串；时间 RFC3339 UTC；版本为正整数。
    成功 envelope `{data, meta:{requestId,serverTime,eventCursor?}}`；命令额外返回 `affected`。
    错误 envelope `{error:{code,message,details?,retryable},requestId}`；客户端按 code+details 处理，不解析 message。
    分页 `?limit=50&cursor=<opaque>`（1-100）；列表 data 为 `{items,nextCursor}`。
    有副作用的业务命令要求 Idempotency-Key 头（UUID）；已有对象写操作要求 expectedVersion；正式决定要求 reviewId/reviewHash。
    Web 会话使用 Cookie+CSRF（sessionCookie）；CLI 使用受限 Bearer grant（bearerGrant）。
    阶段实现状态由 GET /system capabilities 返回；未实现的 operation 返回 501 而不是假成功。
servers:
  - url: /api/v1
    description: Same-origin (SPA or CLI with explicit base URL)
tags:
  - {name: system, description: 系统与能力}
  - {name: auth, description: 注册、登录与设备授权}
  - {name: me, description: 账户、会话、待办与提醒}
  - {name: projects, description: 项目生命周期}
  - {name: members, description: 成员与邀请}
  - {name: positions, description: 职位与身份}
  - {name: workflows, description: 协作流程}
  - {name: repositories, description: 仓库元数据}
  - {name: topics, description: 议题与消息}
  - {name: submissions, description: 统一提交}
  - {name: materials, description: 上传与材料版本}
  - {name: events, description: SSE 事件}
  - {name: plans, description: 计划}
  - {name: tasks, description: 任务}
  - {name: proposals, description: 提案与审批}
  - {name: handoffs, description: 交接}
  - {name: releases, description: 版本发布上报}
  - {name: audit, description: 审计}
  - {name: agent, description: Agent 运行}
  - {name: intents, description: 人工确认意图}
security:
  - sessionCookie: []
  - bearerGrant: []

paths:
  /projects/{projectId}/topics/{topicId}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: topicId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: startAgentRun
      summary: 请求针对某提交的 AI 分析（重复源不续额度）
      tags:
        - agent
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '202':
          description: 已登记批次/运行引用（异步执行）。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - batchId
                    properties:
                      batchId:
                        type: string
                        format: uuid
                      runId:
                        type:
                          - string
                          - 'null'
                  meta:
                    $ref: '#/components/schemas/CommandMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 重复源或上下文版本冲突。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 预算耗尽（BUDGET_EXHAUSTED），需合法续开。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{projectId}/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAgentRun
      summary: 公开运行状态、预算与产物引用
      tags:
        - agent
      security:
        - sessionCookie: []
        - bearerGrant: []
      responses:
        '200':
          description: 运行详情。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AgentRun'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: subscribeRunEvents
      summary: 运行增量 SSE（按 run seq 恢复；私有链路脱敏）
      tags:
        - agent
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: text/event-stream。
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelAgentRun
      summary: 取消运行（不撤销已成立业务决定）
      tags:
        - agent
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRunRequest'
      responses:
        '200':
          description: 已请求取消。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - cancelling
                    properties:
                      cancelling:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/CommandMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{projectId}/batches/{batchId}/extensions:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: extendDiscussionBatch
      summary: 显式续开讨论轮次（manager；部署上限内）
      tags:
        - agent
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchExtensionRequest'
      responses:
        '200':
          description: 已续开。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - maxRounds
                      - extension
                    properties:
                      maxRounds:
                        type: integer
                      extension:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/CommandMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /projects/{projectId}/confirmation-intents:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      operationId: createConfirmationIntent
      summary: CLI 创建人工确认意图（返回 confirmUrl，不是批准）
      tags:
        - intents
      security:
        - bearerGrant: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationIntentRequest'
      responses:
        '201':
          description: 意图已创建。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ConfirmationIntent'
                  meta:
                    $ref: '#/components/schemas/CommandMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{projectId}/confirmation-intents/{intentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: intentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getConfirmationIntent
      summary: 查询意图状态（本人/grant；CLI 轮询用）
      tags:
        - intents
      security:
        - bearerGrant: []
        - sessionCookie: []
      responses:
        '200':
          description: 意图状态与 resultRef。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ConfirmationIntent'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/confirmation-intents/{intentId}/confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: intentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: confirmIntent
      summary: 浏览器一次确认（仅 Web 会话；原子执行原领域命令）
      tags:
        - intents
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmIntentRequest'
      responses:
        '200':
          description: 确认结果（committed/rejected）与 resultRef。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ConfirmationIntent'
                  meta:
                    $ref: '#/components/schemas/CommandMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/register:
    post:
      operationId: register
      summary: 自由注册（邮箱+密码，无邮件验证）
      tags:
        - auth
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功并建立会话（Set-Cookie）。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 邮箱已占用（EMAIL_IN_USE）或幂等冲突。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      operationId: login
      summary: 登录（错误统一 INVALID_CREDENTIALS）
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功（Set-Cookie）。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/session:
    get:
      operationId: getSession
      summary: 当前会话信息（含 CSRF token）
      tags:
        - auth
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 会话有效。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/SessionInfo'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      operationId: logout
      summary: 撤销当前会话并清 Cookie
      tags:
        - auth
      security:
        - sessionCookie: []
        - bearerGrant: []
      responses:
        '200':
          description: 已撤销；会话已过期也允许清本地 Cookie。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - revoked
                    properties:
                      revoked:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: 撤销其他会话与授权
      tags:
        - auth
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedAuthVersion
              properties:
                expectedAuthVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 撤销数量。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - revokedSessions
                      - revokedGrants
                    properties:
                      revokedSessions:
                        type: integer
                      revokedGrants:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/recover:
    post:
      operationId: recoverPassword
      summary: 使用一次性恢复码设置新密码（不自动登录）
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverRequest'
      responses:
        '200':
          description: 完成；旧会话与授权已撤销。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - completed
                    properties:
                      completed:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/device/authorizations:
    post:
      operationId: createDeviceAuthorization
      summary: CLI 发起设备授权（返回 deviceCode/userCode）
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
      responses:
        '201':
          description: 已创建。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceAuthorization'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/device/token:
    post:
      operationId: pollDeviceToken
      summary: CLI 轮询设备授权结果（pending/slow_down/denied/expired/token）
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: pending/slow_down 状态。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceTokenPending'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '201':
          description: 授权完成，返回 token 对。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          description: denied 或 expired。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/device/confirm:
    post:
      operationId: confirmDeviceAuthorization
      summary: 浏览器确认/拒绝设备授权（本人+CSRF）
      tags:
        - auth
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceConfirmRequest'
      responses:
        '200':
          description: 确认结果。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceConfirmResult'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/token/refresh:
    post:
      operationId: refreshToken
      summary: 轮换 token 对（旧 refresh 重放撤销整族）
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 新 token 对。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/device/review:
    get:
      operationId: getDeviceAuthorization
      tags:
        - auth
      summary: Review a pending device authorization
      security:
        - sessionCookie: []
      parameters:
        - name: userCode
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device name, requested scopes and expiry for human review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{projectId}/topics/{topicId}/fork:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: topicId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: forkTopic
      summary: 从固定消息位置分叉公开会话
      tags:
        - collaboration
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkTopicRequest'
      responses:
        '201':
          description: 议题详情。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Topic'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/tasks/{taskId}/activity:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listTaskActivity
      summary: 任务统一活动时间线
      tags:
        - collaboration
      security:
        - sessionCookie: []
        - bearerGrant: []
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: 议题详情。
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - items
                      - nextCursor
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TaskActivity'
                      nextCursor:
                        type:
                          - string
                          - 'null'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/plans/{planId}/discussion-summary:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: planId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
