name: CI
on:
  pull_request: {branches: [main]}
  push: {branches: [main]}
  workflow_dispatch:
    inputs:
      full: {description: Full V2 regression, type: boolean, default: true}
  workflow_call:
    inputs:
      full: {type: boolean, default: true}
permissions: {contents: read}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_PASSWORD: test-only}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      JUDEX_V2_TEST_DSN: postgres://postgres:test-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: azure/setup-helm@v4
        with: {version: v3.18.4}
      - run: go vet ./...
      - run: go test -race -timeout=20m ./...
      - run: go build ./cmd/...
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: '24.10.0', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: npm run test:web
      - run: npm run build
  business:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: '24.10.0', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - run: node scripts/ci/pull-images.mjs postgres:17.6-alpine chrislusf/seaweedfs:4.47
      - run: node tests/v2/local.mjs
        env: {JUDEX_V2_BROWSER: '1'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-business-evidence
          path: |
            .cache/v2-browser
            .cache/v2-local
          include-hidden-files: true
  ci-gate:
    name: CI
    if: always()
    needs: [backend, web, business]
    runs-on: ubuntu-latest
    steps:
      - env: {RESULTS: '${{ toJSON(needs) }}'}
        run: python3 -c 'import os,json; r=json.loads(os.environ["RESULTS"]); assert all(x["result"]=="success" for x in r.values()),r'
