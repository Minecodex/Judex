name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - run: go vet ./...
      - run: go test -race -timeout=20m ./...
      - run: go build ./cmd/...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:web
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: judex-browser-evidence
          path: |
            tests/reports/chat
            tests/results/chat
            .cache/e2e/**/business-results
          if-no-files-found: ignore

  ci-gate:
    name: CI
    if: ${{ always() }}
    needs: ["backend", "web"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          optional = set([])
          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = {
              name: job["result"]
              for name, job in jobs.items()
              if job["result"] != "success"
              and not (name in optional and job["result"] == "skipped")
          }
          if failed:
              print(f"Required CI jobs did not succeed: {failed}")
              sys.exit(1)
          print("All mandatory CI jobs passed.")
          PY
